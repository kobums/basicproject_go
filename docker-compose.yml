# 개발용 DB (+ 선택: API 컨테이너). 값은 .env 에서 읽는다 (cp .env.example .env).
#   make db-up                          → db 만 띄운다 (go run 으로 개발할 때)
#   docker compose --profile api up -d  → db + api (make docker-up)
# db/schema.sql 은 볼륨이 비어 있을 때(처음 뜰 때)만 실행된다. 다시 만들려면 make db-reset (docker compose down -v).
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    profiles: ["api"]
    build: .
    image: basicproject_go:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 compose 네트워크의 db 서비스로 붙는다.
      DB_HOST: db
      DB_PORT: "3306"
      APP_MODE: ${APP_MODE:-production}
      PORT: "8007"
    ports:
      - "${PORT:-8007}:8007"
    volumes:
      - api-webdata:/app/webdata

volumes:
  db-data:
  api-webdata:
